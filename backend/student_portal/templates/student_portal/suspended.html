<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Suspended</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    .container {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        max-width: 420px;
        width: 90%;
    }

    .title {
        color: #dc3545;
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .message {
        font-size: 16px;
        color: #333;
        margin: 10px 0;
    }

    .student-id {
        margin-top: 10px;
        font-size: 15px;
        color: #000;
        font-weight: bold;
    }

    .reason {
        margin-top: 15px;
        font-size: 14px;
        color: #555;
    }

    .contact {
        margin-top: 20px;
        font-size: 14px;
        color: #007bff;
    }
</style>


</head>

<body>


<div class="container">

    <div class="title">Account Suspended</div>

    <div class="message">
        Your student ID is currently suspended.
    </div>

    <div class="student-id">
        Student ID: {{ student_id }}
    </div>

    <div class="message">
        Please contact the institute for further assistance.
    </div>

    <div class="contact">
        Visit institute office or contact support.
    </div>

</div>


</body>
</html>
