<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Student Admission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .form-container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .section-title { border-bottom: 2px solid #0d6efd; margin-bottom: 20px; padding-bottom: 5px; color: #0d6efd; text-transform: uppercase; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container mx-auto" style="max-width: 800px;">
        <div class="text-center mb-4">
            <h2>SMART COMPUTER INSTITUTE</h2> <p class="text-muted">Build Skills, Build Futures....</p> <h4 class="badge bg-primary">ADMISSION FORM</h4> </div>

        <form id="admissionForm">
            <div class="section-title">Personal Details</div> <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Student ID</label>
                    <input type="text" class="form-control" name="student_id" placeholder="MG/SLG/170" required> </div>
                <div class="col-md-6">
                    <label class="form-label">Admission Date</label>
                    <input type="date" class="form-control" name="admission_date" required> </div>
                <div class="col-md-12">
                    <label class="form-label">Student Name</label>
                    <input type="text" class="form-control" name="name" required> </div>
                <div class="col-md-12">
                    <label class="form-label">Guardian Name</label>
                    <input type="text" class="form-control" name="guardian_name"> </div>
                <div class="col-md-4">
                    <label class="form-label">DOB</label>
                    <input type="date" class="form-control" name="dob"> </div>
                <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender"> <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="O">Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-control" name="phone"> </div>
                <div class="col-md-12">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" name="address" rows="2"></textarea> </div>
            </div>

            <div class="section-title">Course Details</div> <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Course Name</label>
                    <input type="text" class="form-control" name="course_name"> </div>
                <div class="col-md-6">
                    <label class="form-label">Course Type</label>
                    <input type="text" class="form-control" name="course_type" placeholder="TYPE 1"> </div>
                <div class="col-md-6">
                    <label class="form-label">Batch Days</label>
                    <input type="text" class="form-control" name="days" placeholder="Mon | Wed | Fri"> </div>
                <div class="col-md-6">
                    <label class="form-label">Batch Time</label>
                    <input type="text" class="form-control" name="time" placeholder="10:00 AM - 11:30 AM"> </div>
            </div>

            <div class="section-title">Payment Details</div> <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Admission Fee (Rs.)</label>
                    <input type="number" class="form-control" id="admAmount" name="adm_amount" value="1000.00"> </div>
                <div class="col-md-4">
                    <label class="form-label">Discount (%)</label>
                    <input type="number" class="form-control" id="discount" name="discount" value="15.00"> </div>
                <div class="col-md-4">
                    <label class="form-label">Final Amount (Rs.)</label>
                    <input type="number" class="form-control" id="finalAmount" name="final_amount" readonly> </div>
            </div>

            <div class="alert alert-info py-2" style="font-size: 0.85rem;">
                <strong>Note:</strong> Fees once paid are non-refundable. Students must maintain 80% attendance. </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary btn-lg px-5">Submit Admission</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Logic to calculate final amount based on discount
    const admInput = document.getElementById('admAmount');
    const discInput = document.getElementById('discount');
    const finalInput = document.getElementById('finalAmount');

    function calculateTotal() {
        const total = parseFloat(admInput.value) || 0;
        const discount = parseFloat(discInput.value) || 0;
        const final = total - (total * (discount / 100));
        finalInput.value = final.toFixed(2);
    }

    [admInput, discInput].forEach(el => el.addEventListener('input', calculateTotal));
    calculateTotal(); // Initial calculation

    document.getElementById('admissionForm').onsubmit = function(e) {
        e.preventDefault();
        alert('Student data captured successfully!');
        console.log('Form Data:', new FormData(this));
    };
</script>

</body>
</html>
