{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}

<style>
    /* ===== FULL PAGE ===== */
/* ===== FULL PAGE ===== */

html, body {
    height: 100%;
    margin: 0;
    background: #000000 !important;
}

#main {
    margin-left: 0 !important;
    width: 100%;
    height: 100%;
}

/* ✅ PERFECT CENTER (stable method) */
#content {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 0 !important;
}

/* remove default spacing */
#container {
    margin: 0 !important;
}

/* ===== CARD (MATCH LOGIN) ===== */
.reset-card {
    max-width: 420px;
    width: 90%;
    background: #f1f5f9;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    border: 1px solid #e2e8f0;
    text-align: center;
}

.reset-card h2 {
    margin-bottom: 25px;
    font-weight: 600;
    color: #1e293b;
    font-size: 1.5rem;
}

.form-group {
    text-align: left;
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: #334155;
}

/* ===== INPUT ===== */
.reset-card input[type="email"],
.reset-card input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 1rem;
    background-color: #9aa5b1;
    color: #ffffff;
}

/* ===== BUTTON ===== */
.reset-button {
    width: 100%;
    padding: 14px;
    background: #5b7c99;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s;
}

.reset-button:hover {
    background: #4a6680;
}

</style>

{% endblock %}

{% block content_title %}{% endblock %}

{% block content %}
<div class="reset-card">
    <h2>Reset Password</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            {{ form.email.label_tag }}
            {{ form.email }}
        </div>

        <button type="submit" class="reset-button">
            Send Reset Link
        </button>
    </form>
</div>
{% endblock %}
