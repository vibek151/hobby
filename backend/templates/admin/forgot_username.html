<!DOCTYPE html>
<html>
<head>
    <title>Forgot Username</title>
</head>
<body>
    <h1>Forgot Username</h1>

    <form method="post">
        {% csrf_token %}
        <input type="email" name="email" required>
        <button type="submit">Get Username</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
</body>
</html>
